name: PostgreSQL schema execution tests

on:
  push:
    branches: [main]
    paths:
      - "database/schema_v1_corrige.sql"
      - "database/migrations/**"
      - "tests/school_headcounts_schema_test.sql"
      - "tests/schema_smoke_tests.sql"
      - "tests/bootstrap_supabase_test.sql"
      - ".github/workflows/postgres-schema-test.yml"
  pull_request:
    paths:
      - "database/schema_v1_corrige.sql"
      - "tests/schema_smoke_tests.sql"
      - "tests/bootstrap_supabase_test.sql"
      - ".github/workflows/postgres-schema-test.yml"

jobs:
  postgres-schema-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestion_beatrice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestion_beatrice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gestion_beatrice_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bootstrap Supabase-compatible test roles
        run: psql -v ON_ERROR_STOP=1 -f tests/bootstrap_supabase_test.sql
      - name: Execute schema in disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f database/schema_v1_corrige.sql
      - name: Apply additive migrations in disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/202611280001_school_year_headcounts.sql
      - name: Restrict direct API access to headcount tables
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/202611280002_restrict_headcounts_api_access.sql
      - name: Disable the obsolete academic decisions RPC
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/202611280003_disable_academic_decisions_rpc.sql
      - name: Run structural smoke tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/schema_smoke_tests.sql
          psql -v ON_ERROR_STOP=1 -f tests/school_headcounts_schema_test.sql
