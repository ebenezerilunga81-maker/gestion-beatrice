name: PostgreSQL schema integration test # also validates migration 004 on PRs

on:
  push:
    branches: [main]
    paths:
      - "database/schema_v1_corrige.sql"
      - "app/main.py"
      - "public/index.html"
      - "tests/schema_smoke_tests.sql"
      - "tests/bootstrap_supabase_test.sql"
      - "database/migrations/003_paiements_usd_cdf_taux_2300.sql"
      - "database/migrations/004_rpc_devise_text_et_historique_eleve.sql"
      - "tests/payment_rpc_currency_test.sql"
      - ".github/workflows/postgres-integration-test.yml"
  pull_request:
    paths:
      - "database/schema_v1_corrige.sql"
      - "app/main.py"
      - "public/index.html"
      - "tests/schema_smoke_tests.sql"
      - "tests/bootstrap_supabase_test.sql"
      - "database/migrations/003_paiements_usd_cdf_taux_2300.sql"
      - "database/migrations/004_rpc_devise_text_et_historique_eleve.sql"
      - "tests/payment_rpc_currency_test.sql"
      - ".github/workflows/postgres-integration-test.yml"
  workflow_dispatch:

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestion_beatrice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestion_beatrice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gestion_beatrice_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate backend Python syntax
        run: python3 -m py_compile app/main.py
      - name: Validate frontend JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          html = open("public/index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script[^>]*>([\s\S]*?)</script>", html, flags=re.IGNORECASE)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          open("/tmp/gestion-beatrice-frontend.js", "w", encoding="utf-8").write("\n".join(scripts))
          PY
          node --check /tmp/gestion-beatrice-frontend.js
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Prepare isolated Supabase-compatible test environment
        run: psql --set ON_ERROR_STOP=1 --file tests/bootstrap_supabase_test.sql
      - name: Execute schema in temporary PostgreSQL database
        run: psql --set ON_ERROR_STOP=1 --file database/schema_v1_corrige.sql
      - name: Apply fixed-currency payment RPC migrations in the disposable database
        run: |
          psql --set ON_ERROR_STOP=1 --file database/migrations/003_paiements_usd_cdf_taux_2300.sql
          psql --set ON_ERROR_STOP=1 --file database/migrations/004_rpc_devise_text_et_historique_eleve.sql
      - name: Run structural smoke tests
        run: psql --set ON_ERROR_STOP=1 --file tests/schema_smoke_tests.sql
      - name: Test partial payment, CDF complement, and overpayment rejection
        run: psql --set ON_ERROR_STOP=1 --file tests/payment_rpc_currency_test.sql
